[project]
name = "invoice-agent"
version = "0.1.0"
description = "Multi-agent invoice processing prototype"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "postgres: requires TEST_DATABASE_URL and a disposable PostgreSQL database",
]
